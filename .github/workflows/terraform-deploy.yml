name: "Terraform Deploy — Infrastructure"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write   # for posting plan output as PR comment
  security-events: write # for SARIF uploads to GitHub Security

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_mongodb_password: ${{ secrets.MONGODB_PASSWORD }}
  TF_VAR_mongodb_app_password: ${{ secrets.MONGODB_APP_PASSWORD }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 1: Security scan — IaC static analysis with Checkov + tfsec
  # ──────────────────────────────────────────────────────────────────────────────
  iac-security-scan:
    name: "IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Checkov ───────────────────────────────────────────────────────────────
      - name: Run Checkov (IaC security scanner)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true  # Don't fail the pipeline (weaknesses are intentional)
        continue-on-error: true

      - name: Upload Checkov SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      # ── tfsec ─────────────────────────────────────────────────────────────────
      - name: Run tfsec (Terraform security scanner)
        run: |
          docker run --rm \
            -v "$(pwd)/terraform:/src" \
            aquasec/tfsec /src \
            --format sarif \
            --out /src/tfsec-results.sarif \
            --soft-fail || true
        continue-on-error: true

      - name: Upload tfsec SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: terraform/tfsec-results.sarif
          category: tfsec

      - name: Summarize IaC findings
        if: always()
        run: |
          echo "## IaC Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Intentional misconfigurations are present in this environment for the Wiz exercise:" >> $GITHUB_STEP_SUMMARY
          echo "- SSH open to 0.0.0.0/0 on MongoDB EC2" >> $GITHUB_STEP_SUMMARY
          echo "- S3 bucket with public read/list" >> $GITHUB_STEP_SUMMARY
          echo "- EC2 with AmazonEC2FullAccess IAM role" >> $GITHUB_STEP_SUMMARY
          echo "- EKS pod with cluster-admin RBAC" >> $GITHUB_STEP_SUMMARY
          echo "- Unencrypted EBS volume on MongoDB EC2" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 2: Terraform Plan (all branches)
  # ──────────────────────────────────────────────────────────────────────────────
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: iac-security-scan
    if: always()  # run even if security scan has warnings/failures
    defaults:
      run:
        working-directory: terraform/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color
        env:
          TF_VAR_mongodb_password: ${{ secrets.MONGODB_PASSWORD }}
          TF_VAR_mongodb_app_password: ${{ secrets.MONGODB_APP_PASSWORD }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `## Terraform Plan 📋
            #### Terraform Format: \`${{ steps.fmt.outcome }}\`
            #### Terraform Validate: \`${{ steps.validate.outcome }}\`
            #### Terraform Plan: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 3: Terraform Apply (main branch only, or manual dispatch with apply)
  # ──────────────────────────────────────────────────────────────────────────────
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: production   # requires manual approval in GitHub Environments
    defaults:
      run:
        working-directory: terraform/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_mongodb_password: ${{ secrets.MONGODB_PASSWORD }}
          TF_VAR_mongodb_app_password: ${{ secrets.MONGODB_APP_PASSWORD }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

      - name: Output infrastructure details
        run: |
          echo "## Terraform Apply Complete ✅" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color | grep -v sensitive >> $GITHUB_STEP_SUMMARY || true
