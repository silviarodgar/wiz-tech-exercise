{{- if .Values.rbac.clusterAdmin }}
# INTENTIONAL WEAKNESS: The tasky service account is granted cluster-admin
# This is required by the Wiz exercise specification but represents a
# privilege escalation risk in a real environment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tasky.fullname" . }}-cluster-admin
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
  annotations:
    note: "Intentional misconfiguration for Wiz security exercise"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
